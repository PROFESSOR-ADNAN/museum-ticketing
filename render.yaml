services:
  - type: web
    name: museum-ticketing-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: museum-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: chapa
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_ENCRYPTION_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: iam.professor.adnan@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Science Museum <iam.professor.adnan@gmail.com>"
      - key: SMS_API_URL
        value: https://api.afromessage.com/api/send
      - key: SMS_API_KEY
        sync: false
      - key: SEED_PASSWORD
        value: admin1234

databases:
  - name: museum-db
    databaseName: museum
    user: museum_user
    plan: free
